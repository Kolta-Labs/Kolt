# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Use plain npm instead of Yarn for Kotlin/JS-Wasm's package management — one less ivy
# repository (github.com/yarnpkg) to wire around dependencyResolutionManagement's
# PREFER_SETTINGS mode.
kotlin.js.yarn=false

GROUP=io.github.koltalabs.kolt
POM_INCEPTION_YEAR=2025
POM_URL=https://github.com/kolta-labs/Kolt/

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/kolta-labs/Kolt/
POM_SCM_CONNECTION=scm:git:git://github.com/kolta-labs/Kolt.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/kolta-labs/Kolt.git

POM_DEVELOPER_ID=kolta-labs
POM_DEVELOPER_NAME=Kolta Labs
POM_DEVELOPER_URL=https://github.com/kolta-labs/
